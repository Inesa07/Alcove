<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#24203A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Planner</title>
    <meta name="apple-mobile-web-app-title" content="Planner" />
    <meta name="description" content="A cozy room that is your planner and diary." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Figtree:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <p class="date" id="date"></p>
        <h1 class="greeting" id="greeting"></h1>
        <form class="name-form" id="name-form" hidden>
          <label for="name-input">What should I call you?</label>
          <input id="name-input" autocomplete="given-name" placeholder="Your name" />
          <button type="submit">Save</button>
        </form>
      </header>

      <section class="room-wrap" aria-label="Your room">
        <div class="room" id="room"></div>
        <div class="toast" id="toast" role="status" hidden></div>
      </section>

      <div class="side">
        <form class="capture" id="capture" autocomplete="off">
          <label for="capture-input" class="sr-only">Write anything</label>
          <input id="capture-input" placeholder="Try “idea: dark mode” or “test Friday 9:00”" />
          <button type="submit" aria-label="Put it in my room">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </form>

        <section class="sheet" id="sheet" aria-live="polite"></section>
      </div>

      <nav class="nav" aria-label="Main" id="nav">
        <button data-view="room" aria-current="page">Room</button>
        <button data-view="week">Week</button>
        <button data-view="notes">Notes</button>
        <button data-view="search">Search</button>
      </nav>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
